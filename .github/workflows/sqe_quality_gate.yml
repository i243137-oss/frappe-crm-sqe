name: SQE Continuous Integration Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  sqe-verification:
    name: Run SQE Test Suite & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone and Pin Upstream CRM Baseline Codebase
        run: |
          git clone https://github.com/frappe/crm crm
          cd crm && git checkout 678ed0d5c99097674ce45dbbc502d8d2afee927d && cd ..

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          playwright install --with-deps chromium

      - name: Run Smoke Verification
        run: |
          pytest tests/team/unit/test_infrastructure_smoke.py -v

      - name: Run White-Box Unit Tests & Measure Real CRM Coverage
        run: |
          pytest tests/team/unit/ -v --cov=crm.fcrm.doctype.crm_deal.crm_deal --cov=crm.fcrm.doctype.crm_lead.crm_lead --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Run REST & RPC API Tests
        run: |
          pytest tests/team/api/test_lead_conversion_api.py tests/team/api/test_deal_status_api.py tests/team/api/test_api_bva_and_ep.py -v

      - name: Run Cross-Workflow Integration Tests
        run: |
          pytest tests/team/api/test_cross_workflow_integration_api.py -v

      - name: Run OpenAPI Test Data Generator Suite
        run: |
          python tests/team/generator/data_generator.py
          pytest tests/team/generator/ -v

      - name: Run Playwright E2E Browser Use Case Tests
        run: |
          pytest tests/team/e2e/test_crm_use_cases_playwright.py -v

      - name: Run Accessibility (a11y) & Usability WCAG Audit
        run: |
          pytest tests/team/a11y/ -v

      - name: Run Defensive Security Assessment
        run: |
          pytest tests/team/security/ -v

      - name: Run Controlled Failure and Recovery Testing
        run: |
          pytest tests/team/performance/test_failure_and_recovery.py -v

      - name: Execute Mutation Quality Gate
        run: |
          python tests/team/mutation/mutation_runner.py

      - name: Run Static Code Quality & Complexity Gate
        run: |
          radon cc tests/team crm/crm/fcrm/doctype/crm_deal/crm_deal.py crm/crm/fcrm/doctype/crm_lead/crm_lead.py -a -nc
          flake8 tests/team --count --select=E9,F63,F7,F82 --show-source --statistics
