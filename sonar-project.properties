# SonarQube Scanner Configuration for Frappe CRM SQE Project
sonar.projectKey=frappe-crm-sqe
sonar.projectName=Frappe CRM SQE Project
sonar.projectVersion=2.0.0

# Disjoint sources and tests: All test files belong under sonar.tests!
sonar.sources=crm/crm/fcrm/doctype/crm_deal,crm/crm/fcrm/doctype/crm_lead
sonar.tests=tests/team
sonar.sourceEncoding=UTF-8

# Ignore git status for files inside crm/
sonar.scm.disabled=true

# Python Analysis & Test Coverage
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/node_modules/**
